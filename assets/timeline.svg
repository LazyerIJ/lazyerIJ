</g>
<g><animate attributeName="opacity" values="1;0;0;1" keyTimes="0;0.0040;0.7312;1" dur="2.79s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,12;0,0" keyTimes="0;0.0040;0.7312;1" dur="2.79s" calcMode="spline" keySplines="0 0 1 1;0 0 1 1;.2 .8 .2 1" fill="freeze"/>
<text x="838" y="82" text-anchor="middle" class="yr">2023.04</text>
<circle cx="838" cy="112" r="26" fill="url(#pulse)" opacity=".5"><animate attributeName="r" values="14;34;14" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;0;.55" dur="3s" repeatCount="indefinite"/></circle>
