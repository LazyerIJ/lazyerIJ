<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="career timeline">
<title>career timeline</title>
<defs><linearGradient id="ax" gradientUnits="userSpaceOnUse" x1="162" y1="0" x2="838" y2="0"><stop offset="0" stop-color="#4d5865"/><stop offset=".45" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="pulse"><stop offset="0" stop-color="#22d3ee" stop-opacity=".9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient></defs>
<style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;dominant-baseline:middle}
    .k{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes breathe{0%,100%{opacity:.18}50%{opacity:.42}}


    .yr{font-size:12.5px;letter-spacing:1px;fill:#7d8a99}
    .co{font-size:16px;font-weight:700}
    .rl{font-size:10.5px;letter-spacing:1px;fill:#4d5865}
    .bu{font-size:11px;fill:#7d8a99}
    
</style>
<rect width="1000" height="330" rx="16" fill="#0d1117" stroke="#1c2430"/>
<line x1="162" y1="112" x2="838" y2="112" stroke="url(#ax)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="676" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" from="676" to="0" dur="1.6s" fill="freeze"/></line>
<circle cy="112" r="4" fill="#22d3ee"><animate attributeName="cx" values="162;838" dur="4.5s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="1.6s" repeatCount="indefinite"/></circle>
