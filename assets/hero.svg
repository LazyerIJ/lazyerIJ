<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="lazyer">
<title>lazyer — always compiling</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e141d"/><stop offset=".55" stop-color="#0d1117"/><stop offset="1" stop-color="#080c12"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".35" stop-color="#22d3ee"/><stop offset=".65" stop-color="#a855f7"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8f1ff"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#f472b6;#3b82f6;#a855f7" dur="9s" repeatCount="indefinite"/></stop></linearGradient>
<radialGradient id="glowA"><stop offset="0" stop-color="#3b82f6" stop-opacity=".55"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#a855f7" stop-opacity=".5"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc" stop-opacity=".30"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient>
<clipPath id="panel"><rect x="1" y="1" width="998" height="318" rx="18"/></clipPath>
<clipPath id="type1"><rect x="52" y="66" height="30" width="112"><animate attributeName="width" from="0" to="112" dur="0.7s" begin="0.2s" fill="freeze"/></rect></clipPath>
<clipPath id="type2"><rect x="52" y="176" height="32" width="168"><animate attributeName="width" from="0" to="168" dur="0.8s" begin="1.8s" fill="freeze"/></rect></clipPath>
<clipPath id="type3"><rect x="52" y="208" height="32" width="530"><animate attributeName="width" from="0" to="530" dur="1.7s" begin="2.7s" fill="freeze"/></rect></clipPath>
</defs>
<style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;dominant-baseline:middle}
    .k{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes breathe{0%,100%{opacity:.18}50%{opacity:.42}}


    .cur{animation:blink 1s steps(1) infinite}
    .cmd{fill:#c9d4e0;font-size:15px}
    .pr{fill:#22d3ee;font-size:15px;font-weight:700}
    .out{fill:#7d8a99;font-size:15px}
    .ttl{font-size:66px;font-weight:800;letter-spacing:6px}
    .g1{mix-blend-mode:screen;animation:gl1 5s steps(1) infinite}
    .g2{mix-blend-mode:screen;animation:gl2 5s steps(1) infinite}
    @keyframes gl1{0%,86%,100%{transform:translate(0,0);opacity:0}
      87%{transform:translate(-4px,2px);opacity:.85}89%{transform:translate(3px,-2px);opacity:.7}
      91%{transform:translate(-2px,1px);opacity:.6}93%{opacity:0}}
    @keyframes gl2{0%,86%,100%{transform:translate(0,0);opacity:0}
      88%{transform:translate(4px,-2px);opacity:.85}90%{transform:translate(-3px,2px);opacity:.7}
      92%{transform:translate(2px,-1px);opacity:.6}94%{opacity:0}}
    .brk{stroke:#22d3ee;stroke-width:2;fill:none}
    
</style>
